name: refresh
# Every 15 minutes: read ADF&G, rebuild, and publish the NEWS (overlay.json on
# the "data" branch, read by the public page) - free on a public repository.
# The 14 MB chart is redeployed to Netlify only when the engine or the
# geometry changes, or once a week. (Ledger #264: each Netlify production
# deploy costs 15 of the free plan's 300 monthly credits.)
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Held state (the data branch)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The one dependency (the PDF reader)
        run: pip install pdfminer.six
      - name: Refresh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TZ: America/Anchorage
        run: python ci_refresh.py --state state
      - name: Publish the news
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ "$(cat state/.commit 2>/dev/null)" = "yes" ] || { echo "nothing to publish"; exit 0; }
          cd state
          rm -rf .git .commit
          git init -q -b data .
          git config user.name "openings-refresher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
          echo "published the news"
